[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-dhcp-dns-sync"
version = "0.1.0"
description = "Sync Synology DSM 7 DHCP leases into Synology DNS zone files."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
synology-dhcp-dns-sync = "synology_dhcp_dns_sync.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[sync]
domain = home.arpa
forward_zone = home.arpa
reverse_zone = 2.0.192.in-addr.arpa
poll_interval_seconds = 5
# DNS TTL for the generated A/PTR records. Keep it short: dynamic hosts can change IP.
dynamic_ttl = 600

[paths]
# Optional advanced overrides. If omitted, work_dir defaults to a `work/`
# directory beside this config file.
# work_dir = /volume1/homes/<user>/scripts/synology-dhcp-dns-sync/work
# lock_path = /volume1/homes/<user>/scripts/synology-dhcp-dns-sync/work/sync.lock
# zone_root_dir = /var/packages/DNSServer/target
# zone_dir = /var/packages/DNSServer/target/named/etc/zone/master
# named_checkzone_path = /var/packages/DNSServer/target/bin/named-checkzone
# reload_script_path = /var/packages/DNSServer/target/script/reload.sh
# dhcp_files entries may be glob patterns; DSM names the reservations file
# after the interface (dhcpd-eth0-static.conf, dhcpd-ovs_bond0-static.conf).
# dhcp_files =
#     /etc/dhcpd/dhcpd.conf
#     /etc/dhcpd/dhcpd-leases.log
#     /etc/dhcpd/dhcpd-*-static.conf
#     /etc/dhcpd/dhcpd.conf.leases
